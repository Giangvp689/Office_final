<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 720" width="1150" height="720" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Mũi tên nhọn nét đứt (Dependency/Association) -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <!-- Mũi tên tam giác rỗng (Realization/Interface realization) -->
    <marker id="triangle" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Tiêu đề mục -->
  <text x="30" y="45" font-size="24" font-weight="bold" fill="#0f172a">3.2.5. Biểu đồ thành phần</text>

  <!-- ==================== CSDL (TRÊN CÙNG Ở GIỮA) ==================== -->
  <g transform="translate(485, 40)">
    <!-- Hộp CSDL màu vàng nhạt -->
    <rect x="0" y="0" width="140" height="48" rx="2" fill="#fef9c3" stroke="#854d0e" stroke-width="1.8"/>
    <line x1="0" y1="16" x2="140" y2="16" stroke="#854d0e" stroke-width="1.2"/>
    <text x="70" y="36" font-size="14" font-weight="bold" fill="#713f12" text-anchor="middle">CSDL</text>
    <!-- Tai tab CSDL nhỏ phía trên góc trái -->
    <rect x="12" y="-7" width="36" height="7" fill="#fef9c3" stroke="#854d0e" stroke-width="1.2"/>
  </g>

  <!-- ==================== KHỐI TRUNG TÂM: BẢO MẬT & PHÂN QUYỀN ==================== -->
  <g transform="translate(470, 310)">
    <!-- Hộp bảo mật -->
    <rect x="0" y="0" width="170" height="75" rx="3" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <!-- 2 chốt icon UML Component bên trái -->
    <rect x="-10" y="15" width="20" height="12" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
    <rect x="-10" y="45" width="20" height="12" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
    <text x="85" y="36" font-size="13" font-weight="bold" fill="#0c4a6e" text-anchor="middle">bảo mật &amp;</text>
    <text x="85" y="55" font-size="13" font-weight="bold" fill="#0c4a6e" text-anchor="middle">phân quyền</text>
  </g>

  <!-- Mũi tên từ Bảo mật lên CSDL -->
  <path d="M 555 310 L 555 96" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#triangle)"/>

  <!-- ==================== CỘT BÊN TRÁI: QUẢN TRỊ & ĐIỀU HÀNH ==================== -->
  <!-- Component: Giao diện quản trị (Nằm góc trái ngoài cùng) -->
  <g transform="translate(30, 330)">
    <rect x="0" y="0" width="145" height="52" rx="3" fill="#f8fafc" stroke="#1e293b" stroke-width="1.8"/>
    <!-- 2 chốt UML -->
    <rect x="-8" y="10" width="16" height="10" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
    <rect x="-8" y="30" width="16" height="10" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
    <text x="72" y="32" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">giao diện quản trị</text>
  </g>

  <!-- Danh sách 7 components con bên Quản trị -->
  <!-- 1. Quản lí nhân sự -->
  <g id="c-nhansu" transform="translate(250, 95)">
    <rect x="0" y="0" width="165" height="42" rx="2" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="-6" y="8" width="13" height="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="-6" y="24" width="13" height="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
    <text x="82" y="26" font-size="12" fill="#0f172a" text-anchor="middle">quản lí nhân sự</text>
  </g>

  <!-- 2. Quản lí danh mục -->
  <g id="c-danhmuc" transform="translate(250, 165)">
    <rect x="0" y="0" width="165" height="42" rx="2" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="-6" y="8" width="13" height="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="-6" y="24" width="13" height="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
    <text x="82" y="26" font-size="12" fill="#0f172a" text-anchor="middle">quản lí danh mục</text>
  </g>

  <!-- 3. Phân công nhiệm vụ -->
  <g id="c-phancong" transform="translate(250, 235)">
    <rect x="0" y="0" width="165" height="42" rx="2" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="-6" y="8" width="13" height="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="-6" y="24" width="13" height="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
    <text x="82" y="26" font-size="12" fill="#0f172a" text-anchor="middle">phân công nhiệm vụ</text>
  </g>

  <!-- 4. Thẩm định & duyệt VB -->
  <g id="c-duyetvb" transform="translate(250, 315)">
    <rect x="0" y="0" width="165" height="42" rx="2" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="-6" y="8" width="13" height="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="-6" y="24" width="13" height="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
    <text x="82" y="26" font-size="12" fill="#0f172a" text-anchor="middle">phê duyệt văn bản đi</text>
  </g>

  <!-- 5. Báo cáo thống kê -->
  <g id="c-thongke" transform="translate(250, 395)">
    <rect x="0" y="0" width="165" height="42" rx="2" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="-6" y="8" width="13" height="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="-6" y="24" width="13" height="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
    <text x="82" y="26" font-size="12" fill="#0f172a" text-anchor="middle">báo cáo thống kê</text>
  </g>

  <!-- 6. Nhật ký kiểm toán -->
  <g id="c-kiemtoan" transform="translate(250, 475)">
    <rect x="0" y="0" width="165" height="42" rx="2" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="-6" y="8" width="13" height="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="-6" y="24" width="13" height="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
    <text x="82" y="26" font-size="12" fill="#0f172a" text-anchor="middle">quản lí nhật ký</text>
  </g>

  <!-- 7. Quản trị CSDL -->
  <g id="c-csdl-admin" transform="translate(250, 555)">
    <rect x="0" y="0" width="165" height="42" rx="2" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="-6" y="8" width="13" height="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="-6" y="24" width="13" height="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
    <text x="82" y="26" font-size="12" fill="#0f172a" text-anchor="middle">quản trị CSDL</text>
  </g>

  <!-- Đường nối từ Giao diện Quản trị tới các component bên trái -->
  <path d="M 175 345 L 210 345 L 210 116 L 243 116" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#triangle)"/>
  <path d="M 175 350 L 215 350 L 215 186 L 243 186" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#triangle)"/>
  <path d="M 175 353 L 220 353 L 220 256 L 243 256" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#triangle)"/>
  <path d="M 175 356 L 243 336" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#triangle)"/>
  <path d="M 175 360 L 243 416" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#triangle)"/>
  <path d="M 175 363 L 220 363 L 220 496 L 243 496" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#triangle)"/>
  <path d="M 175 366 L 210 366 L 210 576 L 243 576" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#triangle)"/>

  <!-- Đường nối từ các Component Quản trị vào Khối Bảo Mật -->
  <path d="M 415 116 L 440 116 L 440 325 L 464 325" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <path d="M 415 186 L 445 186 L 445 335 L 464 335" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <path d="M 415 256 L 450 256 L 450 345 L 464 345" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <path d="M 415 336 L 464 350" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <path d="M 415 416 L 450 416 L 450 360 L 464 360" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <path d="M 415 496 L 445 496 L 445 370 L 464 370" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <path d="M 415 576 L 440 576 L 440 380 L 464 380" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>

  <!-- ==================== CỘT BÊN PHẢI: NGHIỆP VỤ / CÁN BỘ ==================== -->
  <!-- Component: Giao diện người dùng (Cán bộ / Chuyên viên / Văn thư) góc phải ngoài cùng -->
  <g transform="translate(930, 330)">
    <rect x="0" y="0" width="165" height="52" rx="3" fill="#f8fafc" stroke="#1e293b" stroke-width="1.8"/>
    <!-- 2 chốt UML -->
    <rect x="-8" y="10" width="16" height="10" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
    <rect x="-8" y="30" width="16" height="10" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
    <text x="82" y="32" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">giao diện người dùng</text>
  </g>

  <!-- Danh sách 7 components con bên Nghiệp vụ -->
  <!-- 1. Đăng nhập / đổi MK -->
  <g id="c-dangnhap" transform="translate(710, 95)">
    <rect x="0" y="0" width="165" height="42" rx="2" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="-6" y="8" width="13" height="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="-6" y="24" width="13" height="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
    <text x="82" y="26" font-size="12" fill="#0f172a" text-anchor="middle">đăng nhập</text>
  </g>

  <!-- 2. Tiếp nhận văn bản đến -->
  <g id="c-vbden" transform="translate(710, 165)">
    <rect x="0" y="0" width="165" height="42" rx="2" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="-6" y="8" width="13" height="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="-6" y="24" width="13" height="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
    <text x="82" y="26" font-size="12" fill="#0f172a" text-anchor="middle">tiếp nhận văn bản đến</text>
  </g>

  <!-- 3. Soạn thảo văn bản đi -->
  <g id="c-vbdi" transform="translate(710, 235)">
    <rect x="0" y="0" width="165" height="42" rx="2" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="-6" y="8" width="13" height="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="-6" y="24" width="13" height="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
    <text x="82" y="26" font-size="12" fill="#0f172a" text-anchor="middle">soạn thảo văn bản đi</text>
  </g>

  <!-- 4. Phân loại AI -->
  <g id="c-ai" transform="translate(710, 315)">
    <rect x="0" y="0" width="165" height="42" rx="2" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="-6" y="8" width="13" height="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="-6" y="24" width="13" height="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
    <text x="82" y="26" font-size="12" fill="#0f172a" text-anchor="middle">phân tích AI</text>
  </g>

  <!-- 5. Tiến độ nhiệm vụ -->
  <g id="c-tiendo" transform="translate(710, 395)">
    <rect x="0" y="0" width="165" height="42" rx="2" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="-6" y="8" width="13" height="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="-6" y="24" width="13" height="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
    <text x="82" y="26" font-size="12" fill="#0f172a" text-anchor="middle">tiến độ nhiệm vụ</text>
  </g>

  <!-- 6. Quản lí hồ sơ vụ việc -->
  <g id="c-hoso" transform="translate(710, 475)">
    <rect x="0" y="0" width="165" height="42" rx="2" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="-6" y="8" width="13" height="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="-6" y="24" width="13" height="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
    <text x="82" y="26" font-size="12" fill="#0f172a" text-anchor="middle">quản lí hồ sơ</text>
  </g>

  <!-- 7. Lịch công tác & nhắc việc -->
  <g id="c-lich" transform="translate(710, 555)">
    <rect x="0" y="0" width="165" height="42" rx="2" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="-6" y="8" width="13" height="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="-6" y="24" width="13" height="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
    <text x="82" y="26" font-size="12" fill="#0f172a" text-anchor="middle">lịch công tác</text>
  </g>

  <!-- Đường nối từ Giao diện Người dùng tới các component bên phải -->
  <path d="M 930 345 L 895 345 L 895 116 L 881 116" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#triangle)"/>
  <path d="M 930 350 L 890 350 L 890 186 L 881 186" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#triangle)"/>
  <path d="M 930 353 L 885 353 L 885 256 L 881 256" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#triangle)"/>
  <path d="M 930 356 L 881 336" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#triangle)"/>
  <path d="M 930 360 L 881 416" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#triangle)"/>
  <path d="M 930 363 L 885 363 L 885 496 L 881 496" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#triangle)"/>
  <path d="M 930 366 L 895 366 L 895 576 L 881 576" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#triangle)"/>

  <!-- Đường nối từ các Component Nghiệp vụ vào Khối Bảo Mật -->
  <path d="M 710 116 L 675 116 L 675 325 L 646 325" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <path d="M 710 186 L 670 186 L 670 335 L 646 335" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <path d="M 710 256 L 665 256 L 665 345 L 646 345" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <path d="M 710 336 L 646 350" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <path d="M 710 416 L 665 416 L 665 360 L 646 360" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <path d="M 710 496 L 670 496 L 670 370 L 646 370" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <path d="M 710 576 L 675 576 L 675 380 L 646 380" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>

